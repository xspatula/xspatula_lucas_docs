# Site Footer
footer:
  links:
    - label: "GitHub"
      icon: "fab fa-fw fa-github"
      url: "https://github.com/karttur-v2/"
    - label: "Linkedin"
      icon: "fab fa-fw fa-linkedin"
      url: "https://www.linkedin.com/in/thomas-gumbricht-588a2a23"
    - label: "Google scholar"
      icon: "fab fa-fw fa-google-scholar"
